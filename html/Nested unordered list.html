<html>
	<head>
		<title>nested unordered list</title>
	</head>
	<body>
		<h1>Nested unordered list</h1>
		<ul>
			<li>Fruits</li>
				<ul>
					<li>Apple</li>
					<li>Mango</li>
					<li>Banana</li>
					<li>Pine apple</li>
					<li>Gauva</li>
				</ul>
				
			<li>Vegetable</li>
				<ul>
					<li>Potato</li>
					<li>Onine</li>
					<li>Chilli</li>
					<li>Cabbage</li>
					<li>Carrot</li>
				</ul>
				
		</ul>	
	</body>
</html>
